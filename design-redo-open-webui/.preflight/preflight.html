<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ============================================================
   colors_and_type.css — DAgent Console redesign
   References Open WebUI layout patterns with original design tokens
   ============================================================ */

:root {
  /* ─── Brand prefix: dagent ───────────────────────────────── */

  /* Surface */
  --dagent-background: #ffffff;
  --dagent-foreground: #0d0d0d;
  --dagent-card: #f5f5f5;
  --dagent-card-foreground: #0d0d0d;
  --dagent-popover: #ffffff;
  --dagent-popover-foreground: #0d0d0d;

  /* Primary (accent green from original tokens) */
  --dagent-primary: #10a37f;
  --dagent-primary-foreground: #ffffff;

  /* Muted */
  --dagent-muted: #f5f5f5;
  --dagent-muted-foreground: #6e6e6e;

  /* Border / Input / Ring */
  --dagent-border: #e5e5e5;
  --dagent-input: #e5e5e5;
  --dagent-ring: rgba(16, 163, 127, 0.18);

  /* Radius */
  --dagent-radius-sm: 12px;
  --dagent-radius-md: 16px;
  --dagent-radius-lg: 20px;

  /* ─── Extended design tokens ──────────────────────────────── */
  --sidebar-bg: #fafafa;
  --sidebar-hover: #f0f0f0;
  --sidebar-width: 260px;
  --topbar-height: 60px;
  --input-bg: #f5f5f5;
  --input-border: #e5e5e5;
  --message-max-width: 768px;
  --font-display: "Signifier", "Source Serif Pro", Georgia, ui-serif, serif;
  --font-body: "Söhne", "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "Söhne Mono", ui-monospace, monospace;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 20px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --motion-fast: 150ms;
  --motion-base: 220ms;
  --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
  --accent: #10a37f;
  --accent-hover: #0a7a5e;
  --accent-soft: #e8f5f0;
  --fg: #0d0d0d;
  --fg-2: #1a1a1a;
  --muted: #6e6e6e;
  --meta: #9b9b9b;
  --border: #e5e5e5;
  --border-soft: #ededed;
  --bg: #ffffff;
  --surface: #f5f5f5;
  --surface-warm: #fafafa;
  --focus-ring: 0 0 0 3px rgba(16, 163, 127, 0.18);
  --success: #10a37f;
  --warn: #f5a623;
  --danger: #ef4146;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--fg);
  background: var(--bg);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

*, *::before, *::after {
  box-sizing: border-box;
}

::selection {
  background: var(--accent-soft);
  color: var(--fg);
}

:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: 8px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--dagent-background);
    --color-foreground: var(--dagent-foreground);
    --color-card: var(--dagent-card);
    --color-card-foreground: var(--dagent-card-foreground);
    --color-popover: var(--dagent-popover);
    --color-popover-foreground: var(--dagent-popover-foreground);
    --color-primary: var(--dagent-primary);
    --color-primary-foreground: var(--dagent-primary-foreground);
    --color-muted: var(--dagent-muted);
    --color-muted-foreground: var(--dagent-muted-foreground);
    --color-border: var(--dagent-border);
    --color-input: var(--dagent-input);
    --color-ring: var(--dagent-ring);
    --color-accent: var(--accent);
    --radius-sm: var(--dagent-radius-sm);
    --radius-md: var(--dagent-radius-md);
    --radius-lg: var(--dagent-radius-lg);
  }
  @layer base {
    body { background: var(--dagent-background); color: var(--dagent-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .bg-input { background-color: var(--dagent-input); }

      .bg-ring { background-color: var(--dagent-ring); }
      .text-ring { color: var(--dagent-ring); }
      .border-ring { border-color: var(--dagent-ring); }
      .ring-ring { --tw-ring-color: var(--dagent-ring); }
      .bg-accent { background-color: var(--accent); }
      .text-accent { color: var(--accent); }
      .border-accent { border-color: var(--accent); }
      .ring-accent { --tw-ring-color: var(--accent); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;

        -webkit-mask-size: contain;

        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;

        background-color: currentColor;
      }
