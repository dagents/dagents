# Dagents local full-stack infrastructure.
#
# Bring up the two core services (Postgres + Langfuse):
#   cd infra && docker compose up -d && docker compose ps
#
# All host ports are bound to 127.0.0.1 only. The canonical service port
# (Langfuse 3001) is free on this host so it is bound as-is. Only Postgres
# (5432) collides with other projects on this machine, so its host-side binding
# is remapped by default; the in-network service port stays canonical so
# inter-container wiring (DSNs) is unchanged. Override any value via
# a local .env file (see .env.example).
#
# Langfuse is pinned to the latest v2.x (2.95.11). The `:latest` tag now points
# at v3.x, which mandates ClickHouse (CLICKHOUSE_URL) and a separate migration
# path — far heavier than this local stack needs. v2 stores traces in Postgres
# only, matching the plan's "PG + Langfuse, no extra stores" intent. See
# infra/README.md for the rationale and the v3 upgrade trigger.

name: dagents

services:
  postgres:
    image: postgres:16-alpine
    # Single Postgres instance shared by Langfuse. Each app targets
    # a dedicated DB (langfuse) that POSTGRES_DB does not create for
    # us, so a one-shot init container materializes both after the server is
    # healthy (and is idempotent on later boots).
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dagents}
      POSTGRES_USER: ${POSTGRES_USER:-dagents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dagents_dev}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dagents}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the langfuse database on first boot. `createdb` exits
  # non-zero once a DB exists, so `|| ... skip` keeps the run idempotent; the
  # container exits 0 and `service_completed_successfully` unblocks dependents.
  postgres-init:
    image: postgres:16-alpine
    environment:
      PGUSER: ${POSTGRES_USER:-dagents}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dagents_dev}
    entrypoint: ["/bin/sh", "-c"]
    # `$$` escapes the `$` for compose so the shell sees a real loop variable.
    command:
      - "set -e; for db in langfuse dagents; do echo \"creating db $$db\"; createdb -h postgres -U \"$$PGUSER\" \"$$db\" || echo \"db $$db already exists, skip\"; done; echo init-done"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  langfuse:
    # Pinned to v2.95.11 (latest v2.x). v3 requires ClickHouse — see header.
    image: langfuse/langfuse:2.95.11
    ports:
      - "127.0.0.1:${LANGFUSE_HOST_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dagents}:${POSTGRES_PASSWORD:-dagents_dev}@postgres:5432/langfuse?sslmode=disable
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse_dev_secret_change_me}
      SALT: ${LANGFUSE_SALT:-langfuse_dev_salt_change_me}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_HOST_PORT:-3001}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      # Langfuse exposes /api/public/health as its liveness probe. Next.js
      # binds the listener to the container's hostname (not 127.0.0.1), so a
      # probe against localhost fails with ECONNREFUSED and the service never
      # flips to healthy. `$HOSTNAME` resolves to the address next-server is
      # actually listening on.
      test: ["CMD-SHELL", "wget -qO- http://$$HOSTNAME:3000/api/public/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
