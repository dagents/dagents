appId: dev.dagents.desktop
productName: dagents
directories:
  output: release
# 只带 tsc 产物与 main 入口定位文件；本包零 runtime 依赖 → node_modules 无需入包
files:
  - dist/**
  - package.json
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: dagents-${version}-setup.${ext}
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
