name: Feature request
description: Propose a new capability or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The use case or pain point — what's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would a good solution look like?
      description: Your proposed behavior, API shape, or UX. Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other workarounds, configs, or tools you tried.
