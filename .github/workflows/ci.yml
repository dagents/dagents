# Continuous integration — runs on every push to main and on PRs.
#
# Pipeline: install (frozen lockfile) → build → typecheck → lint → apply DB
# migrations → run the test suite.
#
# Path awareness: the `changes` job (dorny/paths-filter) detects whether the PR
# touches source at all; docs-only changes skip the heavy ci job entirely.
#
# Why a Postgres service: several gateway/db tests hit a real database — they
# call `AppDataSource.initialize()` + `runQuery` in beforeAll (see
# apps/gateway/src/__tests__/directories.test.ts), and the DB layer runs with
# `synchronize: false`, so the schema only exists after `migration:run`.
#
# Deliberately skipped:
#   - Playwright e2e: boots the full gateway+daemon stack against a fake LLM and
#     needs the wider dev environment; lives in e2e.yml instead.
#
# lint runs across every workspace. Only errors fail the job —
# `no-unused-vars` and `react-hooks/exhaustive-deps` are warnings by design
# (see .eslintrc.cjs).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: read lets dorny/paths-filter resolve changed files via the
# pulls API on PR events — without it Dependabot-triggered runs (restricted
# token) fail with "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'apps/**'
              - 'packages/**'
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - '.eslintrc.cjs'
              - '.npmrc'
              - '.github/workflows/ci.yml'

  ci:
    name: build • typecheck • lint • test
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagents
          POSTGRES_PASSWORD: dagents_dev
          POSTGRES_DB: dagents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_URL: postgresql://dagents:dagents_dev@localhost:5432/dagents

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --config.ignore-scripts=false 放开依赖构建脚本——.npmrc 的全局
        # ignore-scripts=true 会压过 onlyBuiltDependencies 白名单。node-pty 的
        # tarball 只带 win32/darwin prebuild，linux 必须由 install 脚本现场
        # node-gyp 编译（gateway shell-registry 静态 import node-pty，缺原生
        # 模块 24 个测试文件全灭）。白名单保证仍只有 node-pty 跑脚本；
        # ubuntu-latest 自带 python3/make/g++。
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec turbo run lint

      - name: Apply DB migrations
        run: pnpm --filter @dagents/db migration:run

      - name: Test
        # No exclusion filter: @dagents/e2e was deleted from the workspace, and
        # turbo errors on `--filter='!..<pkg>'` for a nonexistent package.
        run: pnpm exec turbo run test

  # Full image build (both stages), no push. The release workflow builds the
  # image only on tags — without this guard, a broken Dockerfile surfaces
  # mid-release (four such bugs shipped to the first v0.1.0 tag attempt).
  docker:
    name: docker image build
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dagents:ci
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci
