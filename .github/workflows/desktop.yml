# Desktop 打包 CI —— apps/desktop 三平台安装包（docs/desktop-architecture.md §4.2）。
#
# 与 ci.yml 的分工：纯检查（vitest / tsc / eslint / 打包配置齐备性）由 ci.yml 的
# turbo 全 workspace 遍历自动覆盖（desktop 的 test script 自带 check-builder-config），
# 本文件只做打包产物 job——win nsis 本机已实证链路，mac dmg（x64/arm64）与
# linux AppImage 归此处实跑（需求 userStory 6「从 CI 拿到本平台安装包」）。
#
# pnpm install 零开关：electron 44.x 无 install script（架构文档 §2.4 实测），
# ignore-scripts=true 原样成立；二进制由 ensure:electron 显式按需下载。
# 镜像默认 npmmirror（受限网络实测可用），可用仓库变量 ELECTRON_MIRROR /
# ELECTRON_BUILDER_BINARIES_MIRROR 覆盖（如维护者偏好直连 GitHub）。
# 产物 upload-artifact 归档供人工取用——无发布基础设施（outOfScope：不做自动更新）。

name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 打包 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest, platform: win, target: nsis, arch: x64 }
          - { name: mac-x64, os: macos-latest, platform: mac, target: dmg, arch: x64 }
          - { name: mac-arm64, os: macos-latest, platform: mac, target: dmg, arch: arm64 }
          - { name: linux-x64, os: ubuntu-latest, platform: linux, target: AppImage, arch: x64 }
    runs-on: ${{ matrix.os }}
    # M6 服务栈入包：staging（gateway deploy + console standalone + 内嵌 PG）在打包前实跑，
    # 全链路耗时显著上升（deploy ~5min + standalone build ~4min + 245MB 级打包）。
    timeout-minutes: 45
    env:
      ELECTRON_MIRROR: ${{ vars.ELECTRON_MIRROR || 'https://npmmirror.com/mirrors/electron/' }}
      ELECTRON_BUILDER_BINARIES_MIRROR: ${{ vars.ELECTRON_BUILDER_BINARIES_MIRROR || 'https://npmmirror.com/mirrors/electron-builder-binaries/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # linux 无 node-pty prebuild（tarball 只带 darwin/win），需要本地编译
      # node-gyp 工具链——Dockerfile L47-48 同款；stage-stack 的 deploy 步骤对
      # linux 自动加 --config.ignore-scripts=false（onlyBuiltDependencies=[node-pty]
      # 白名单语义，供应链不放宽——其余包的 install script 仍被 .npmrc 阻断）。
      - name: Install node-pty build toolchain (linux only)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 make g++

      # GH Windows runner 的 Defender 实时防护会在 pnpm install 落盘时误杀个别构建
      # 依赖文件（2026-10-07 三轮实证：builder-util 需要的 source-map-support 目录
      # 在而主文件消失 → node MODULE_NOT_FOUND；linux/mac 与本机均无此象）。构建目录
      # 与 pnpm store 加排除是 GH win runner 的标准做法（微软文档亦推荐构建目录排除）。
      - name: Windows Defender exclusions (win only)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $store = (pnpm store path --silent | Out-String).Trim()
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
          if ($store) { Add-MpPreference -ExclusionPath $store }
          Write-Host "Defender exclusions added: $env:GITHUB_WORKSPACE ; $store"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # deploy 拷贝 workspace 包当前产物——先全仓构建（desktop 除外：镜像红线，Dockerfile 同款过滤）
      - name: Build workspace packages
        run: pnpm run build --filter='!@dagents/desktop'

      - name: Build @dagents/desktop
        run: pnpm --filter @dagents/desktop run build

      - name: Ensure electron binary
        run: pnpm --filter @dagents/desktop run ensure:electron

      # 内嵌 PG 二进制（按 matrix 平台取 @embedded-postgres tarball；镜像可覆盖）。
      # arch 必须传 matrix 目标值：mac-x64 job 跑在 macos-latest（ARM runner）交叉出
      # x64 dmg——按运行器 arch 取包会错拿 darwin-arm64 二进制。
      - name: Ensure embedded postgres
        run: pnpm --filter @dagents/desktop run ensure:postgres
        env:
          DAGENTS_DESKTOP_PG_MIRROR: ${{ vars.DAGENTS_DESKTOP_PG_MIRROR || 'https://registry.npmmirror.com' }}
          DAGENTS_DESKTOP_PG_ARCH: ${{ matrix.arch }}

      # 服务栈 staging：gateway deploy + console standalone 三件套 → stage/services
      - name: Stage service stack
        run: pnpm --filter @dagents/desktop run stage:stack

      # ── win runner source-map-support 误杀对策与诊断（2026-10-07，三轮实证）──
      # Defender 落盘误杀假设的物证收集（Get-MpThreatDetection + 目录内容）+ 兜底
      # 自愈（.pnpm 实体包复制补位；排除步生效后预期全 True 且无 self-healed）。
      # 只影响构建工具环境（source-map-support 仅 electron-builder 构建期加载），
      # 不入产物。
      - name: Trace + ensure source-map-support (win only)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          try {
            Get-MpThreatDetection -ErrorAction SilentlyContinue |
              Where-Object { "$($_.Resources)" -match 'source-map' } |
              Select-Object -First 3 | Format-List | Out-String | Write-Host
          } catch { Write-Host "threat query unavailable: $_" }
          foreach ($d in @('node_modules/source-map-support')) {
            if (Test-Path $d) {
              Get-ChildItem $d | ForEach-Object { Write-Host ("pkg file: " + $_.Name) }
            } else { Write-Host "pkg dir missing: $d" }
          }
          $src = Get-ChildItem node_modules/.pnpm -Directory -Filter 'source-map-support@*' | Select-Object -First 1
          if (-not $src) { Write-Host "::error::.pnpm 无 source-map-support 实体包（store 侧缺失，需人工排查）"; exit 1 }
          $srcDir = Join-Path $src.FullName 'node_modules/source-map-support'
          $targets = @('node_modules/source-map-support') + @(
            Get-ChildItem node_modules/.pnpm -Directory -Filter 'builder-util@*' |
              ForEach-Object { (Join-Path $_.FullName 'node_modules') + '/source-map-support' }
          )
          foreach ($t in $targets) {
            $present = Test-Path (Join-Path $t 'package.json')
            Write-Host ("pre-package {0}/package.json => {1}" -f $t, $present)
            if (-not $present) {
              New-Item -ItemType Directory -Force -Path $t | Out-Null
              Copy-Item -Recurse -Force "$srcDir\*" $t
              Write-Host ("self-healed: {0}" -f $t)
            }
          }
          node -e "console.log('resolve:', require.resolve('source-map-support'))"

      - name: Package (${{ matrix.target }} ${{ matrix.arch }})
        run: >-
          pnpm --filter @dagents/desktop exec electron-builder
          --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dagents-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
          retention-days: 14
          if-no-files-found: error
