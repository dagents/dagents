# CodeQL — static security analysis for the TypeScript codebase.
#
# Scope is limited to apps/ + packages/ (see .github/codeql/codeql-config.yml):
# vendor/agentflow is vendored upstream code we don't analyze or maintain.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions: read — codeql-action fetches the workflow run (for SARIF
  # categorization); without it Dependabot-triggered PR runs are rejected.
  actions: read
  security-events: write

jobs:
  analyze:
    name: analyze (js/ts)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
