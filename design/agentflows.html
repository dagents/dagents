<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentFlows · Mega Agents</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <style>
    /* ── list page ── */
    .flow-list-page { }

    /* scope tabs — same as agents.html */
    .scope-tabs { display: inline-flex; gap: 2px; background: var(--surface); border-radius: var(--radius-sm); padding: 3px; }
    .scope-tabs button { border: 0; background: transparent; padding: 6px var(--space-3); border-radius: 9px; font-size: var(--text-xs); font-weight: 500; color: var(--muted); cursor: pointer; transition: background var(--motion-fast), color var(--motion-fast); display: inline-flex; align-items: center; gap: 5px; }
    .scope-tabs button:hover { color: var(--fg); }
    .scope-tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: var(--elev-ring); }
    .scope-tabs .cnt { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; }

    /* filter chips — same style as agents.html filter-chip */
    .filter-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--space-3); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--text-xs); color: var(--fg-2); font-weight: 500; cursor: pointer; transition: all var(--motion-fast); }
    .filter-chip:hover { border-color: #d4d4d4; }
    .filter-chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

    .flow-toolbar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
    .flow-search { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
    .flow-search input { width: 100%; height: 34px; padding: 0 var(--space-3) 0 30px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--text-sm); }
    .flow-search input:focus { border-color: var(--accent); box-shadow: var(--focus-ring); outline: none; }
    .flow-search svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; color: var(--meta); }

    .flow-card { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: hidden; margin-bottom: var(--space-3); transition: box-shadow var(--motion-fast); }
    .flow-card:hover { box-shadow: var(--elev-raised); }
    .flow-card-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); cursor: pointer; }
    .flow-card-head:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }
    .flow-card-head:hover { background: var(--surface-warm); }
    .flow-chev { width: 16px; height: 16px; color: var(--meta); flex-shrink: 0; transition: transform var(--motion-fast); }
    .flow-card.expanded .flow-chev { transform: rotate(90deg); }
    .flow-glyph { width: 36px; height: 36px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border-soft); display: grid; place-items: center; font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--fg); flex-shrink: 0; }
    .flow-info { flex: 1; min-width: 0; }
    .flow-info .nm { font-size: var(--text-base); font-weight: 600; color: var(--fg); }
    .flow-info .sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: var(--space-3); flex-wrap: wrap; }
    .flow-info .sub .mono { font-family: var(--font-mono); }
    .flow-card-meta { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
    .flow-card-actions { display: flex; gap: var(--space-2); margin-left: var(--space-2); }
    .flow-card-actions .btn { white-space: nowrap; }
    .flow-card-actions .btn-sm { height: 28px; padding: 0 var(--space-3); font-size: 11px; }

    .flow-runs { display: none; border-top: 1px solid var(--border-soft); }
    .flow-card.expanded .flow-runs { display: block; }
    .run-row { display: grid; grid-template-columns: 90px 1fr 80px 80px 100px 80px 34px; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-5); font-size: var(--text-sm); border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background var(--motion-fast); text-decoration: none; color: inherit; }
    .run-row:last-child { border-bottom: 0; }
    .run-row:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }
    .run-row:hover { background: var(--surface-warm); }
    .run-id { font-family: var(--font-mono); font-size: 12px; color: var(--accent-hover); font-weight: 500; }
    .run-trigger { color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-cell { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
    .run-cell.num { color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }
    .run-time { font-family: var(--font-mono); font-size: 11px; color: var(--meta); }
    .run-arrow { color: var(--meta); text-align: right; }

    /* ── detail page (DAG + inspector) ── */
    .flow-detail-page { display: none; }
    .flow-detail-page.active { display: block; }
    .flow-back { display: inline-flex; align-items: center; gap: var(--space-2); height: 28px; padding: 0 var(--space-2); border-radius: 8px; color: var(--muted); font-size: var(--text-xs); text-decoration: none; transition: background var(--motion-fast), color var(--motion-fast); margin-bottom: var(--space-4); }
    .flow-back:hover { background: var(--surface-warm); color: var(--fg); }
    .flow-back:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .flow-back svg { width: 14px; height: 14px; }

    .flow-layout { display: grid; grid-template-columns: 1fr 340px; gap: var(--space-4); height: calc(100vh - var(--topbar-h) - var(--space-8) - var(--space-8) - 90px); min-height: 560px; }

    .flow-canvas-wrap { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; }
    .flow-canvas-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
    .flow-canvas-head .title { font-size: var(--text-sm); font-weight: 600; flex: 1; min-width: 0; }
    .flow-canvas-head .ver { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .flow-canvas-stage { flex: 1; position: relative; overflow: hidden; background:
      radial-gradient(circle, var(--border-soft) 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: 0 0;
    }
    .flow-canvas-stage svg { width: 100%; height: 100%; display: block; }
    .node { cursor: pointer; }
    .node rect { transition: filter var(--motion-fast); }
    .node:hover rect { filter: drop-shadow(0 2px 6px rgba(13,13,13,0.12)); }
    .node:focus-visible { outline: none; }
    .node:focus-visible rect { stroke: var(--accent); stroke-width: 2; }
    .node.selected rect { stroke: var(--accent); stroke-width: 2; }
    .node-label { font-size: 11px; font-weight: 500; fill: var(--fg); font-family: var(--font-body); }
    .node-sub { font-size: 9px; fill: var(--muted); font-family: var(--font-mono); }
    .edge { fill: none; stroke: var(--border); stroke-width: 1.5; }
    .edge.active { stroke: var(--accent); stroke-width: 2; }
    .edge-label { font-size: 9px; fill: var(--meta); font-family: var(--font-mono); }
    .node-pill-running { fill: var(--accent); }
    .node-pill-done { fill: var(--success); }
    .node-pill-queued { fill: var(--warn); }
    .node-pill-failed { fill: var(--danger); }
    .node-pill-paused { fill: var(--info); }
    .node-pill-idle { fill: var(--meta); }

    .legend-flow { display: flex; gap: var(--space-3); padding: var(--space-2) var(--space-4); border-top: 1px solid var(--border-soft); flex-shrink: 0; }
    .legend-flow .li { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
    .legend-flow .sw { width: 10px; height: 10px; border-radius: 3px; }

    .inspector { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; }
    .insp-head { padding: var(--space-4); border-bottom: 1px solid var(--border-soft); }
    .insp-head .type { font-size: 11px; color: var(--accent-hover); font-weight: 500; letter-spacing: var(--tracking-label); text-transform: uppercase; }
    .insp-head .nm { font-size: var(--text-base); font-weight: 600; margin-top: 2px; }
    .insp-body { flex: 1; overflow-y: auto; padding: var(--space-4); }
    .insp-section { margin-bottom: var(--space-5); }
    .insp-section .lbl { font-size: 11px; color: var(--meta); letter-spacing: var(--tracking-label); text-transform: uppercase; margin-bottom: var(--space-2); }
    .io-box { background: var(--surface-warm); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: var(--space-3); font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
    .run-meta { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); font-size: var(--text-xs); }
    .run-meta dt { color: var(--muted); }
    .run-meta dd { font-family: var(--font-mono); color: var(--fg); text-align: right; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-16); text-align: center; }
    .empty-state .h { font-size: var(--text-base); font-weight: 600; color: var(--fg); margin-bottom: var(--space-2); }
    .empty-state .d { font-size: var(--text-sm); color: var(--muted); }

    @media (max-width: 1024px) { .flow-layout { grid-template-columns: 1fr; height: auto; } .inspector { max-height: 360px; } .flow-canvas-stage { min-height: 360px; } .run-row { grid-template-columns: 1fr; gap: 2px; } .flow-card-actions .btn { display: none; } .flow-card-actions .btn:first-child { display: inline-flex; } }
    @media (max-width: 640px) { .flow-card-actions { display: none; } .flow-card-meta .chip { display: none; } }
    @media (prefers-reduced-motion: reduce) { .node rect, .flow-card, .flow-chev { transition: none; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="app-sidebar" data-od-id="sidebar">
      <div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Mega Agents</div><div class="brand-sub">控制台 · v0.2</div></div></div>
      <nav class="nav" aria-label="主导航"></nav>
      <div class="sidebar-footer"></div>
    </aside>

    <header class="app-topbar" data-od-id="topbar">
      <button class="icon-btn mobile-menu-btn" aria-label="菜单"></button>
      <div class="crumbs"><span class="crumb">编排</span><span class="sep">/</span><span class="crumb-current" id="crumb-current">AgentFlows</span></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-search"><span class="search-icon" id="ic"></span><input type="search" placeholder="搜索 flows / runs…" aria-label="搜索" /><kbd>⌘K</kbd></div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="通知" title="通知"><span id="bell"></span><span class="dot"></span></button>
        <button class="avatar" aria-label="账户" title="饶哲">RZ</button>
      </div>
    </header>

    <main class="app-main">
      <div class="page">
        <!-- ===== LIST PAGE ===== -->
        <div class="flow-list-page" id="flow-list-page">
          <div class="page-head">
            <div class="page-head-title">
              <h1 class="page-title">AgentFlows</h1>
              <p class="page-subtitle">Agentflow V2 DAG 流水线。每个 flow 可有多次运行记录，点击展开查看历史 run，点击 run 进入 DAG 详情。</p>
            </div>
            <div class="page-actions">
              <button class="btn btn-accent btn-sm" id="new-flow" title="新建 flow">+ 新建 Flow</button>
            </div>
          </div>

          <div class="scope-tabs mb-6" role="tablist" aria-label="flow 范围">
            <button role="tab" aria-selected="false" data-scope="mine">我的 <span class="cnt" id="cnt-mine">0</span></button>
            <button role="tab" aria-selected="true" data-scope="all">全部 <span class="cnt" id="cnt-all">0</span></button>
            <button role="tab" aria-selected="false" data-scope="archived">已归档 <span class="cnt" id="cnt-archived">0</span></button>
          </div>

          <div class="flow-toolbar">
            <div class="flow-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="flow-q" placeholder="搜索 flow 名称或 ID…" aria-label="搜索 flow" />
            </div>
            <button class="filter-chip" data-f="status" data-v="running" aria-pressed="false">运行中</button>
            <button class="filter-chip" data-f="status" data-v="done" aria-pressed="false">已完成</button>
            <button class="filter-chip" data-f="status" data-v="paused" aria-pressed="false">已暂停</button>
            <button class="filter-chip" data-f="status" data-v="failed" aria-pressed="false">失败</button>
            <div class="grow"></div>
            <span class="result-count" id="result-count" style="font-size:11px;color:var(--meta);font-family:var(--font-mono)"></span>
          </div>

          <div id="flow-cards"></div>
        </div>

        <!-- ===== DETAIL PAGE ===== -->
        <div class="flow-detail-page" id="flow-detail-page">
          <a class="flow-back" href="#" id="flow-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            返回 AgentFlows
          </a>

          <div class="flow-layout" data-od-id="flow-detail-layout">
            <div class="flow-canvas-wrap">
              <div class="flow-canvas-head">
                <div class="title" id="canvas-title">—</div>
                <span class="ver" id="canvas-ver">—</span>
                <span class="status" id="canvas-status"></span>
              </div>
              <div class="flow-canvas-stage">
                <svg id="dag" viewBox="0 0 1300 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Agentflow DAG"></svg>
              </div>
              <div class="legend-flow">
                <span class="li"><span class="sw node-pill-running"></span>运行</span>
                <span class="li"><span class="sw node-pill-done"></span>完成</span>
                <span class="li"><span class="sw node-pill-queued"></span>排队</span>
                <span class="li"><span class="sw node-pill-failed"></span>失败</span>
                <span class="li"><span class="sw node-pill-paused"></span>暂停</span>
                <span class="li"><span class="sw node-pill-idle"></span>未触发</span>
              </div>
            </div>

            <div class="inspector" data-od-id="inspector">
              <div class="insp-head">
                <div class="type" id="insp-type">—</div>
                <div class="nm" id="insp-name">—</div>
              </div>
              <div class="insp-body" id="insp-body"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>window.OD_NAV = { active: 'flows' };</script>
  <script src="js/workspace-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/flows-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const S = window.OD.svg;
      document.getElementById('ic').innerHTML = S.search;
      document.getElementById('bell').innerHTML = S.bell;
      document.querySelector('.mobile-menu-btn').innerHTML = S.menu;

      const flows = window.OD_FLOWS;
      const STATUS_CN = { running:'运行', done:'完成', queued:'排队', failed:'失败', paused:'暂停', idle:'未触发' };
      const CHEV = '<svg class="flow-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

      // assign owner + archived flag to flows (for scope filtering)
      const OWNERS = ['饶哲', '林敏', '邓凯'];
      flows.forEach((f, i) => {
        f.owner = OWNERS[i % OWNERS.length];
        f.archived = (f.status === 'failed' || f.status === 'paused');
      });

      // scope state
      let scope = 'all';

      // generate run history for each flow
      const RUN_HISTORY = {};
      flows.forEach((f, fi) => {
        const runs = [];
        // current run
        if (f.run) {
          runs.push({ id: f.run, flowIdx: fi, status: f.status, trigger: '手动触发 · 饶哲', duration: f.status === 'running' ? '进行中' : '6m12s', cost: '$8.40', nodes: f.nodes, edges: f.edges, time: '14:20 今日', version: f.version, hash: f.hash });
        }
        // historical runs (synthetic)
        const histCount = 2 + fi;
        for (let i = 0; i < histCount; i++) {
          const rid = 'R-' + (8800 - fi * 10 - i);
          const statuses = ['done', 'done', 'failed', 'done'];
          const st = statuses[i % statuses.length];
          const trigger = ['定时触发', 'webhook · workspace', '手动触发 · 林敏', 'API · 外部系统'][i % 4];
          runs.push({
            id: rid, flowIdx: fi, status: st,
            trigger: trigger,
            duration: (4 + i * 2) + 'm' + (10 + i * 7) + 's',
            cost: '$' + (3.2 + i * 1.8).toFixed(2),
            nodes: f.nodes.map(n => Object.assign({}, n, { status: st === 'failed' && n.id === (f.nodes[f.nodes.length-2]||{}).id ? 'failed' : 'done', runId: rid, logs: n.logs ? [{t:'13:'+(40-i*5),l:st==='failed'?'err':'ok',m:st==='failed'?'node failed':'completed'}] : [] })),
            edges: f.edges,
            time: (i + 1) + ' 天前',
            version: 'v' + (2 + fi) + '.' + (2 - i) + '.' + (i + 1),
            hash: ('a' + fi + 'b' + i + 'c' + (3-i) + 'd' + (5+fi)),
          });
        }
        RUN_HISTORY[f.id] = runs;
      });

      // ── list page ──
      const listPage = document.getElementById('flow-list-page');
      const detailPage = document.getElementById('flow-detail-page');
      const cardsEl = document.getElementById('flow-cards');
      let q = '';
      const statusFilter = new Set();

      function visibleFlows() {
        const ql = q.trim().toLowerCase();
        return flows.filter(f => {
          // scope filter
          if (scope === 'archived') { if (!f.archived) return false; }
          else {
            if (f.archived) return false;
            if (scope === 'mine' && f.owner !== '饶哲') return false;
          }
          // status filter
          if (statusFilter.size && !statusFilter.has(f.status)) return false;
          // search
          if (ql && !(f.name.toLowerCase().includes(ql) || f.id.toLowerCase().includes(ql))) return false;
          return true;
        });
      }

      function updateScopeCounts() {
        const c = { mine: 0, all: 0, archived: 0 };
        flows.forEach(f => {
          if (f.archived) c.archived++;
          else { c.all++; if (f.owner === '饶哲') c.mine++; }
        });
        document.getElementById('cnt-mine').textContent = c.mine;
        document.getElementById('cnt-all').textContent = c.all;
        document.getElementById('cnt-archived').textContent = c.archived;
      }
      updateScopeCounts();

      // scope tab binding
      document.querySelectorAll('.scope-tabs button').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.scope-tabs button').forEach(x => x.setAttribute('aria-selected', 'false'));
          b.setAttribute('aria-selected', 'true');
          scope = b.dataset.scope;
          renderList();
        });
      });

      function renderList() {
        const list = visibleFlows();
        document.getElementById('result-count').textContent = list.length + ' / ' + flows.length + ' 个 flow';

        if (!list.length) {
          cardsEl.innerHTML = '<div class="empty-state"><div class="h">没有匹配的 flow</div><div class="d">试试调整筛选条件或清除搜索。</div></div>';
          return;
        }

        cardsEl.innerHTML = list.map(f => {
          const runs = RUN_HISTORY[f.id] || [];
          const glyph = f.name.charAt(0);
          return `<div class="flow-card" data-flow-id="${f.id}">
            <div class="flow-card-head" data-toggle="${f.id}" role="button" tabindex="0" aria-expanded="false" aria-label="展开 flow ${f.name} 的运行记录">
              ${CHEV}
              <div class="flow-glyph">${glyph}</div>
              <div class="flow-info">
                <div class="nm">${f.name}</div>
                <div class="sub">
                  <span class="mono">${f.id}</span>
                  <span>${f.version}</span>
                  <span>${f.nodes.length} 节点</span>
                  <span>${runs.length} 次运行</span>
                </div>
              </div>
              <div class="flow-card-meta">
                <span class="status ${f.status}"><span class="dot"></span>${STATUS_CN[f.status]}</span>
                ${f.run ? `<span class="chip chip-outline mono" style="font-size:10px">${f.run}</span>` : ''}
              </div>
              <div class="flow-card-actions">
                <button class="btn btn-secondary btn-sm" data-action="edit" data-flow-id="${f.id}" title="在 Flowise 中编辑画布">编辑画布</button>
                <button class="btn btn-accent btn-sm" data-action="run" data-flow-id="${f.id}" title="运行此 flow">▶ 运行</button>
              </div>
            </div>
            <div class="flow-runs">
              <div class="lg-head" style="display:grid;grid-template-columns:90px 1fr 80px 80px 100px 80px 34px;gap:12px;align-items:center;padding:8px 20px;font-size:11px;font-weight:500;color:var(--meta);letter-spacing:0.04em;text-transform:uppercase;border-bottom:1px solid var(--border-soft);background:var(--surface-warm)">
                <span>Run ID</span><span>触发</span><span>状态</span><span>耗时</span><span>成本</span><span>时间</span><span></span>
              </div>
              ${runs.map(r => `<a class="run-row" href="#flow=${f.id}&run=${r.id}" role="button" tabindex="0" aria-label="查看 ${r.id} 的 DAG 详情">
                <span class="run-id">${r.id}</span>
                <span class="run-trigger">${r.trigger}</span>
                <span><span class="status ${r.status}"><span class="dot"></span>${STATUS_CN[r.status]}</span></span>
                <span class="run-cell">${r.duration}</span>
                <span class="run-cell num">${r.cost}</span>
                <span class="run-time">${r.time}</span>
                <span class="run-arrow">›</span>
              </a>`).join('')}
            </div>
          </div>`;
        }).join('');

        // bind card toggle + action buttons (delegated click + keyboard)
        cardsEl.onclick = (e) => {
          // action buttons (edit / run) — don't toggle the card
          const actionBtn = e.target.closest('[data-action]');
          if (actionBtn) {
            e.stopPropagation();
            const fid = actionBtn.dataset.flowId;
            const act = actionBtn.dataset.action;
            if (act === 'edit') {
              alert('打开 Flowise 编辑画布：' + fid + '（演示）');
            } else if (act === 'run') {
              const f = flows.find(x => x.id === fid);
              if (f) {
                const runs = RUN_HISTORY[fid] || [];
                const firstRun = runs[0];
                if (firstRun) showDetail(fid, firstRun.id);
              }
            }
            return;
          }
          const head = e.target.closest('[data-toggle]');
          if (head) {
            const card = head.closest('.flow-card');
            if (card) { card.classList.toggle('expanded'); head.setAttribute('aria-expanded', card.classList.contains('expanded') ? 'true' : 'false'); }
            return;
          }
          const runRow = e.target.closest('.run-row');
          if (runRow) {
            e.preventDefault();
            const href = runRow.getAttribute('href') || '';
            const flowMatch = href.match(/flow=([^&]+)/);
            const runMatch = href.match(/run=([^&]+)/);
            if (flowMatch && runMatch) showDetail(flowMatch[1], runMatch[1]);
            return;
          }
        };
        // keyboard activation for flow-card-head and run-row
        cardsEl.onkeydown = (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          const head = e.target.closest('[data-toggle]');
          if (head) { e.preventDefault(); head.click(); return; }
          const runRow = e.target.closest('.run-row');
          if (runRow) { e.preventDefault(); runRow.click(); return; }
        };
      }

      // search + filters
      document.getElementById('flow-q').addEventListener('input', (e) => { q = e.target.value; renderList(); });
      document.querySelectorAll('.filter-chip[data-f="status"]').forEach(c => {
        c.addEventListener('click', () => {
          const v = c.dataset.v;
          if (statusFilter.has(v)) { statusFilter.delete(v); c.setAttribute('aria-pressed','false'); }
          else { statusFilter.add(v); c.setAttribute('aria-pressed','true'); }
          renderList();
        });
      });

      // ── detail page ──
      const svg = document.getElementById('dag');
      const NODE_ICONS = { 'Agent':'A','LLM':'L','Tool':'T','Condition':'?','Iteration':'↻','HITL':'⚑','HTTP':'⇄','Subflow':'⛓','Start':'▶','Retriever':'🔍','Direct Reply':'■','Human Input':'✋' };

      function showDetail(flowId, runId) {
        const f = flows.find(x => x.id === flowId);
        if (!f) return;
        const runs = RUN_HISTORY[flowId] || [];
        const run = runs.find(r => r.id === runId) || runs[0];
        if (!run) return;

        listPage.style.display = 'none';
        detailPage.classList.add('active');
        document.getElementById('crumb-current').textContent = f.name + ' · ' + run.id;
        document.title = f.name + ' · ' + run.id + ' · Mega Agents';

        // canvas header
        document.getElementById('canvas-title').textContent = f.name + ' — ' + run.id;
        document.getElementById('canvas-ver').textContent = run.version + ' · sha ' + run.hash;
        const cs = document.getElementById('canvas-status');
        cs.className = 'status ' + run.status;
        cs.innerHTML = '<span class="dot"></span>' + STATUS_CN[run.status] + ' · ' + run.trigger;

        // render DAG
        renderDAG(run);

        // select first node
        const first = svg.querySelector('.node');
        if (first) {
          first.classList.add('selected');
          const firstId = first.getAttribute('data-id');
          const firstNode = run.nodes.find(n => n.id === firstId);
          if (firstNode) renderInspector(firstNode, run, f);
        }
      }

      function hideDetail() {
        listPage.style.display = '';
        detailPage.classList.remove('active');
        document.getElementById('crumb-current').textContent = 'AgentFlows';
        document.title = 'AgentFlows · Mega Agents';
      }

      document.getElementById('flow-back').addEventListener('click', (e) => { e.preventDefault(); hideDetail(); });

      function renderDAG(run) {
        let edgesHtml = '';
        run.edges.forEach(e => {
          const from = run.nodes.find(n => n.id === e.from);
          const to = run.nodes.find(n => n.id === e.to);
          if (!from || !to) return;
          const x1 = from.x + from.w, y1 = from.y + from.h / 2;
          const x2 = to.x, y2 = to.y + to.h / 2;
          const mx = (x1 + x2) / 2;
          const d = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
          const cls = (from.status === 'running' || from.status === 'done') && (to.status === 'running' || to.status === 'queued') ? 'edge active' : 'edge';
          edgesHtml += `<path class="${cls}" d="${d}"/>`;
          if (e.label) edgesHtml += `<text class="edge-label" x="${mx}" y="${(y1 + y2) / 2 - 4}" text-anchor="middle">${e.label}</text>`;
        });

        let nodesHtml = '';
        run.nodes.forEach(n => {
          nodesHtml += `<g class="node" data-id="${n.id}" transform="translate(${n.x},${n.y})" tabindex="0" role="button" aria-label="${n.type} 节点 ${n.label}，状态 ${STATUS_CN[n.status]||n.status}">
            <rect width="${n.w}" height="${n.h}" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
            <rect x="0" y="0" width="4" height="${n.h}" rx="2" class="node-pill-${n.status}"/>
            <text x="14" y="20" class="node-label">${n.label}</text>
            <text x="14" y="34" class="node-sub">${n.sub || ''}</text>
            <circle cx="${n.w - 14}" cy="14" r="4" class="node-pill-${n.status}"/>
          </g>`;
        });
        svg.innerHTML = edgesHtml + nodesHtml;

        // bind node clicks (delegated on svg)
        svg.onclick = (e) => {
          const g = e.target.closest('.node');
          if (!g) return;
          svg.querySelectorAll('.node').forEach(x => x.classList.remove('selected'));
          g.classList.add('selected');
          const id = g.getAttribute('data-id');
          const node = run.nodes.find(n => n.id === id);
          if (node) renderInspector(node, run, flows.find(f => f.id === run.flowId || RUN_HISTORY[f.id] && RUN_HISTORY[f.id].includes(run)));
        };
      }

      function renderInspector(n, run, f) {
        document.getElementById('insp-type').textContent = n.type + ' 节点';
        document.getElementById('insp-name').textContent = n.label;
        const logs = (n.logs || []).map(l => `<div class="log-line"><span class="log-ts">${l.t}</span><span class="log-lvl ${l.l}">${l.l.toUpperCase()}</span><span class="log-msg">${l.m}</span></div>`).join('') || '<div class="muted" style="font-size:12px">暂无日志</div>';
        document.getElementById('insp-body').innerHTML = `
          <div class="insp-section">
            <div class="lbl">状态</div>
            <dl class="run-meta">
              <dt>节点状态</dt><dd><span class="status ${n.status}"><span class="dot"></span>${STATUS_CN[n.status]||n.status}</span></dd>
              <dt>所属 run</dt><dd>${n.runId || run.id || '—'}</dd>
              <dt>耗时</dt><dd>${n.duration || '—'}</dd>
              <dt>调用 agent</dt><dd>${n.agent || '—'}</dd>
            </dl>
          </div>
          <div class="insp-section">
            <div class="lbl">输入</div>
            <div class="io-box">${n.input || '—'}</div>
          </div>
          <div class="insp-section">
            <div class="lbl">输出</div>
            <div class="io-box">${n.output || '—'}</div>
          </div>
          <div class="insp-section">
            <div class="lbl">预算与计量</div>
            <dl class="run-meta">
              <dt>预算上限</dt><dd>${n.budget || '—'}</dd>
              <dt>已用 tokens</dt><dd>${n.tokens || '—'}</dd>
              <dt>已用成本</dt><dd>${n.cost || '—'}</dd>
              <dt>超时</dt><dd>${n.timeout || '—'}</dd>
            </dl>
          </div>
          <div class="insp-section">
            <div class="lbl">日志</div>
            <div class="log" style="max-height:180px">${logs}</div>
          </div>
        `;
      }

      // check URL hash for deep link
      function checkHash() {
        const h = location.hash;
        if (h.startsWith('#flow=')) {
          const flowMatch = h.match(/flow=([^&]+)/);
          const runMatch = h.match(/run=([^&]+)/);
          if (flowMatch && runMatch) { showDetail(flowMatch[1], runMatch[1]); return; }
        }
        hideDetail();
      }
      window.addEventListener('hashchange', checkHash);

      // init
      renderList();
      checkHash();
    });
  </script>
</body>
</html>
